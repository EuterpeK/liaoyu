name: liaoyu-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: liaoyu
      POSTGRES_PASSWORD: liaoyu
      POSTGRES_DB: liaoyu
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liaoyu -d liaoyu"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
