<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiaoYu 管理台</title>
<script>
  /* 最早注册的错误捕获：主脚本哪怕解析失败，错误也会顶到页面上 */
  window.onerror = function (msg, src, line, col) {
    var bar = document.getElementById('fatal') || document.body.appendChild(document.createElement('div'));
    bar.id = 'fatal';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c05a3c;color:#fff;font-size:13px;padding:8px 16px;';
    bar.textContent = '脚本错误: ' + msg + ' @' + (line || '?') + ':' + (col || '?');
  };
  window.onunhandledrejection = function (e) {
    var r = e && e.reason;
    window.onerror('未处理的请求错误: ' + (r && r.message ? r.message : r));
  };
</script>
<style>
  :root {
    --ink: #1f3b2c;
    --sub: #6f8b7d;
    --accent: #1d7a52;
    --accent-2: #3cb47c;
    --gold: #c98a2d;
    --danger: #c05a3c;
    --glass: rgba(255, 255, 255, 0.62);
    --line: rgba(31, 59, 44, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(60% 36% at 12% 0%, rgba(151, 216, 181, 0.5) 0%, rgba(151, 216, 181, 0) 100%),
      radial-gradient(52% 32% at 92% 6%, rgba(196, 233, 210, 0.65) 0%, rgba(196, 233, 210, 0) 100%),
      radial-gradient(70% 40% at 50% 108%, rgba(178, 226, 197, 0.55) 0%, rgba(178, 226, 197, 0) 100%),
      linear-gradient(180deg, #e8f3ec 0%, #f2f8f3 100%);
    background-attachment: fixed;
  }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(31, 59, 44, 0.08);
  }
  /* 顶栏 */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: rgba(247, 251, 248, 0.75);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #1d5c3f; }
  .brand small { font-weight: 400; color: var(--sub); margin-left: 10px; font-size: 13px; letter-spacing: 0; }
  .top .spacer { flex: 1; }
  .whoami { color: var(--sub); font-size: 14px; }
  button, .btn {
    border: none; cursor: pointer; font: inherit;
    border-radius: 999px; padding: 9px 20px; font-size: 14px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; font-weight: 600;
    box-shadow: 0 6px 16px rgba(29, 122, 82, 0.28);
  }
  button.ghost, .btn.ghost {
    background: rgba(255, 255, 255, 0.7); color: var(--accent);
    border: 1px solid rgba(46, 158, 107, 0.4); box-shadow: none; font-weight: 500;
  }
  button.danger { background: rgba(192, 90, 60, 0.1); color: var(--danger); box-shadow: none; border: 1px solid rgba(192, 90, 60, 0.35); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select {
    font: inherit; color: var(--ink);
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(46, 158, 107, 0.3);
    border-radius: 10px; padding: 8px 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent-2); }
  /* Tab 导航 */
  .tabs { display: flex; gap: 8px; padding: 18px 28px 0; flex-wrap: wrap; }
  .tab {
    padding: 9px 22px; border-radius: 999px; cursor: pointer; font-size: 14px;
    color: #4a6b5a; background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(46, 158, 107, 0.22);
  }
  .tab.on {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px rgba(29, 122, 82, 0.28);
  }
  /* 主体 */
  main { padding: 20px 28px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { padding: 20px 22px; }
  .stat .k { color: var(--sub); font-size: 13px; letter-spacing: 2px; }
  .stat .v { font-size: 30px; font-weight: 800; margin-top: 6px; }
  .stat .v small { font-size: 14px; color: var(--sub); font-weight: 400; }
  .panel { padding: 22px 24px; margin-bottom: 18px; }
  .panel h2 { font-size: 17px; margin-bottom: 4px; }
  .panel .desc { color: var(--sub); font-size: 13px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--sub); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 12px; font-size: 12px; font-weight: 600; }
  .pill.green { color: var(--accent); background: rgba(60, 180, 124, 0.14); }
  .pill.gold { color: var(--gold); background: rgba(240, 200, 120, 0.22); }
  .pill.gray { color: var(--sub); background: rgba(111, 139, 125, 0.14); }
  .pill.red { color: var(--danger); background: rgba(192, 90, 60, 0.12); }
  .row-ops { display: flex; gap: 8px; align-items: center; }
  .row-ops input { width: 64px; padding: 5px 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .empty { color: #8fa89b; text-align: center; padding: 36px 0; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
    background: rgba(31, 59, 44, 0.92); color: #fff; font-size: 14px;
    padding: 10px 24px; border-radius: 999px; opacity: 0; transition: opacity 0.25s;
    pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
  /* 登录 */
  #login {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  #login .card { width: 360px; padding: 40px 36px; text-align: center; }
  #login .logo { font-size: 34px; font-weight: 800; letter-spacing: 3px; color: #1d5c3f; }
  #login .sub { color: var(--sub); font-size: 13px; margin: 8px 0 28px; letter-spacing: 4px; }
  #login input { width: 100%; margin-bottom: 12px; padding: 11px 14px; }
  #login .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .money { font-weight: 700; color: #b9752e; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: #4a6b5a; }
  .detail { color: var(--sub); font-size: 12px; max-width: 340px; overflow-wrap: anywhere; }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card glass">
    <div class="logo">LiaoYu</div>
    <div class="sub">管 理 台</div>
    <input id="username" placeholder="管理员用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btn-login" style="width:100%;margin-top:8px">登 录</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="brand">LiaoYu <small>管理台</small></div>
    <div class="spacer"></div>
    <span class="whoami" id="whoami"></span>
    <button class="ghost" id="btn-logout">退出</button>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- 基础 ---------------- */
const $ = (s) => document.querySelector(s);
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    headers: opts.body ? { 'content-type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && !path.startsWith('/login')) {
    showLogin();
    throw new Error('登录已过期，请重新登录');
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || '请求失败');
  return res.json();
}
/* 任何未捕获的脚本错误都直接显示在页面上，便于排查（保留头部捕获的升级版：带文件位置） */
window.onerror = function (msg, src, line, col) {
  showFatal('脚本错误: ' + msg + ' @' + (line || '?') + ':' + (col || '?'));
};
window.onunhandledrejection = function (e) {
  var r = e && e.reason;
  showFatal('请求错误: ' + (r && r.message ? r.message : r));
};
function showFatal(msg) {
  let bar = document.getElementById('fatal');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'fatal';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#c05a3c;color:#fff;font-size:13px;padding:8px 16px;';
    document.body.appendChild(bar);
  }
  bar.textContent = msg;
}
const yuan = (c) => '¥' + (c / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2 });
const dt = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '—');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const PILL = { active: 'green', paid: 'green', pending: 'gold', rejected: 'red', cancelled: 'gray', completed: 'green', teacher_no_show: 'red' };
const PILL_TEXT = { active: '在职', pending: '待审核', rejected: '已驳回', paid: '已支付', cancelled: '已取消', completed: '已完成', teacher_no_show: '老师缺席' };
const pill = (s) => `<span class="pill ${PILL[s] || 'gray'}">${esc(PILL_TEXT[s] || s)}</span>`;

/* ---------------- 登录 ---------------- */
function showLogin() {
  $('#login').hidden = false;
  $('#app').hidden = true;
}
$('#btn-login').onclick = async () => {
  $('#login-err').textContent = '';
  const btn = $('#btn-login');
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const me = await api('/login', { method: 'POST', body: { username: $('#username').value.trim(), password: $('#password').value } });
    sessionStorage.setItem('liaoyu_admin', me.username);
    await enter(me.username);
  } catch (e) {
    $('#login-err').textContent = e.message === '请求失败' ? '网络异常或服务未启动' : e.message;
  }
  btn.disabled = false;
  btn.textContent = '登 录';
};
$('#password').addEventListener('keydown', (e) => e.key === 'Enter' && $('#btn-login').click());
$('#btn-logout').onclick = async () => {
  await api('/logout', { method: 'POST' }).catch(() => {});
  sessionStorage.removeItem('liaoyu_admin');
  showLogin();
};

/* ---------------- 导航 ---------------- */
const TABS = [
  { id: 'overview', label: '概览', render: renderOverview },
  { id: 'teachers', label: '老师管理', render: renderTeachers },
  { id: 'orders', label: '订单', render: renderOrders },
  { id: 'settlements', label: '结算', render: renderSettlements },
  { id: 'audit', label: '审计日志', render: renderAudit },
];
let currentTab = 'overview';

async function enter(username) {
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#whoami').textContent = username;
  $('#tabs').innerHTML = TABS.map((t) => `<div class="tab" data-id="${t.id}">${t.label}</div>`).join('');
  document.querySelectorAll('.tab').forEach((el) => (el.onclick = () => switchTab(el.dataset.id)));
  switchTab('overview');
}
async function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('on', el.dataset.id === id));
  const tab = TABS.find((t) => t.id === id);
  $('#main').innerHTML = '<div class="empty">加载中…</div>';
  try {
    await tab.render($('#main'));
  } catch (e) {
    if (e.message !== '未登录') $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ---------------- 概览 ---------------- */
async function renderOverview(el) {
  const [teachers, orders] = await Promise.all([api('/teachers'), api('/orders')]);
  const revenue = orders.filter((o) => o.status === 'paid').reduce((s, o) => s + o.amountCents, 0);
  const students = new Set(orders.map((o) => o.userId)).size;
  const cards = [
    { k: '入驻老师', v: teachers.filter((t) => t.status === 'active').length, s: `待审 ${teachers.filter((t) => t.status === 'pending').length}` },
    { k: '购买学员', v: students, s: '按订单去重' },
    { k: '订单数', v: orders.length, s: `已支付 ${orders.filter((o) => o.status === 'paid').length}` },
    { k: '累计收入', v: yuan(revenue), s: '已支付订单合计', money: true },
  ];
  const recent = orders.slice(0, 8);
  el.innerHTML = `
    <div class="stats">${cards.map((c) => `
      <div class="stat glass"><div class="k">${c.k}</div><div class="v" ${c.money ? 'style="color:#b9752e"' : ''}>${esc(c.v)}</div><div class="k">${esc(c.s)}</div></div>`).join('')}
    </div>
    <div class="panel glass">
      <h2>最近订单</h2><div class="desc">按创建时间倒序，最多 8 条</div>
      ${recent.length ? orderTable(recent) : '<div class="empty">暂无订单</div>'}
    </div>`;
}

/* ---------------- 老师管理 ---------------- */
async function renderTeachers(el) {
  const [all, pending] = await Promise.all([api('/teachers'), api('/teachers?status=pending')]);
  el.innerHTML = `
    <div class="panel glass">
      <h2>待审核（${pending.length}）</h2><div class="desc">批准需指定初始等级 1~3</div>
      ${pending.length ? `
        <table><tr><th>老师</th><th>实名</th><th>方向</th><th>资质</th><th>申请时间</th><th style="width:220px">操作</th></tr>
        ${pending.map((t) => `
          <tr>
            <td><b>${esc(t.displayName)}</b></td>
            <td>${esc(t.realName)}</td>
            <td>${esc((t.directions || []).join('、'))}</td>
            <td class="detail">${esc((t.credentials || []).join('、')) || '—'}</td>
            <td>${dt(t.createdAt)}</td>
            <td><div class="row-ops">
              <input type="number" id="lvl-${t.userId}" value="2" min="1" max="3">
              <button data-uid="${t.userId}" data-name="${esc(t.displayName)}" class="act-approve">批准</button>
              <button class="danger act-reject" data-uid="${t.userId}" data-name="${esc(t.displayName)}">驳回</button>
            </div></td>
          </tr>`).join('')}</table>` : '<div class="empty">没有待审核的申请</div>'}
    </div>
    <div class="panel glass">
      <h2>全部老师（${all.length}）</h2><div class="desc">含在职、待审、已驳回</div>
      <table><tr><th>老师</th><th>实名</th><th>等级</th><th>状态</th><th>方向</th><th>入驻时间</th></tr>
      ${all.map((t) => `
        <tr>
          <td><b>${esc(t.displayName)}</b></td>
          <td>${esc(t.realName)}</td>
          <td>Lv${t.level}</td>
          <td>${pill(t.status)}</td>
          <td>${esc((t.directions || []).join('、'))}</td>
          <td>${dt(t.createdAt)}</td>
        </tr>`).join('')}</table>
    </div>`;
  el.querySelectorAll('.act-approve').forEach((b) => (b.onclick = () => review(b.dataset.uid, true, b.dataset.name)));
  el.querySelectorAll('.act-reject').forEach((b) => (b.onclick = () => review(b.dataset.uid, false, b.dataset.name)));
}
async function review(userId, approve, name) {
  try {
    const body = approve ? { approve: true, level: Number($(`#lvl-${userId}`).value) } : { approve: false };
    await api(`/teachers/${userId}/review`, { method: 'POST', body });
    toast(`${name} ${approve ? '已批准' : '已驳回'}`);
    switchTab('teachers');
  } catch (e) {
    toast(e.message);
  }
}

/* ---------------- 订单 ---------------- */
async function renderOrders(el) {
  el.innerHTML = `
    <div class="panel glass">
      <h2>订单</h2><div class="desc">支持按状态筛选，可导出 CSV</div>
      <div class="toolbar">
        <select id="order-status">
          <option value="">全部状态</option>
          <option value="pending">待支付</option>
          <option value="paid">已支付</option>
          <option value="cancelled">已取消</option>
          <option value="refunded">已退款</option>
        </select>
        <button class="ghost" id="order-refresh">刷新</button>
        <a class="btn ghost" href="/api/admin/orders.csv" style="text-decoration:none">导出 CSV</a>
      </div>
      <div id="order-body"></div>
    </div>`;
  const load = async () => {
    const status = $('#order-status').value;
    const rows = await api('/orders' + (status ? `?status=${status}` : ''));
    $('#order-body').innerHTML = rows.length ? orderTable(rows) : '<div class="empty">暂无订单</div>';
  };
  $('#order-refresh').onclick = load;
  $('#order-status').onchange = load;
  await load();
}
function orderTable(rows) {
  return `
    <table><tr><th>订单号</th><th>学员</th><th>老师</th><th>套餐</th><th>金额</th><th>状态</th><th>支付时间</th></tr>
    ${rows.map((o) => `
      <tr>
        <td class="mono">${esc(o.outTradeNo)}</td>
        <td>${esc(o.userNickname || o.userId)}</td>
        <td>${esc(o.teacherName || o.teacherId)}</td>
        <td>${esc(o.packageTitle)}</td>
        <td class="money">${yuan(o.amountCents)}</td>
        <td>${pill(o.status)}</td>
        <td>${dt(o.paidAt)}</td>
      </tr>`).join('')}</table>`;
}

/* ---------------- 结算 ---------------- */
async function renderSettlements(el) {
  const [rows, bps] = await Promise.all([api('/settlements'), api('/settings/commission-bps')]);
  el.innerHTML = `
    <div class="panel glass">
      <h2>平台佣金比例</h2><div class="desc">基点（bps），10000 = 100%</div>
      <div class="row-ops">
        <input type="number" id="bps" value="${bps.bps}" min="0" max="9999">
        <button id="bps-save">保存</button>
      </div>
    </div>
    <div class="panel glass">
      <h2>生成结算单</h2><div class="desc">对该周期内已完成服务的计提生成结算</div>
      <div class="row-ops">
        <input type="date" id="p-start"> <span style="color:var(--sub)">至</span> <input type="date" id="p-end">
        <button id="gen">生成</button>
      </div>
    </div>
    <div class="panel glass">
      <h2>结算单（${rows.length}）</h2>
      ${rows.length ? `
        <table><tr><th>老师</th><th>周期</th><th>流水</th><th>佣金</th><th>应结</th><th>状态</th><th>操作</th></tr>
        ${rows.map((s) => `
          <tr>
            <td><b>${esc(s.teacherName || s.teacherId)}</b></td>
            <td>${s.periodStart} ~ ${s.periodEnd}</td>
            <td class="money">${yuan(s.grossCents)}</td>
            <td>-${yuan(s.commissionCents)} <span class="muted" style="font-size:12px">(${(s.commissionBps / 100).toFixed(1)}%)</span></td>
            <td class="money">${yuan(s.netCents)}</td>
            <td>${s.status === 'paid' ? pill('paid') : pill('pending')}</td>
            <td>${s.status === 'paid'
              ? `<span class="detail">${esc(s.proof || '')} ${dt(s.paidAt)}</span>`
              : `<button class="ghost act-pay" data-id="${s.id}">标记已打款</button>`}</td>
          </tr>`).join('')}</table>` : '<div class="empty">暂无结算单</div>'}
    </div>`;
  $('#bps-save').onclick = async () => {
    try {
      await api('/settings/commission-bps', { method: 'PUT', body: { bps: Number($('#bps').value) } });
      toast('佣金比例已更新');
    } catch (e) { toast(e.message); }
  };
  $('#gen').onclick = async () => {
    try {
      const created = await api('/settlements/generate', { method: 'POST', body: { periodStart: $('#p-start').value, periodEnd: $('#p-end').value } });
      toast(`已生成 ${created.length} 张结算单`);
      switchTab('settlements');
    } catch (e) { toast(e.message); }
  };
  el.querySelectorAll('.act-pay').forEach((b) => (b.onclick = async () => {
    const proof = prompt('打款凭证（转账单号/截图说明）：');
    if (!proof) return;
    try {
      await api(`/settlements/${b.dataset.id}/pay`, { method: 'POST', body: { proof } });
      toast('已标记打款');
      switchTab('settlements');
    } catch (e) { toast(e.message); }
  }));
}

/* ---------------- 审计日志 ---------------- */
async function renderAudit(el) {
  const logs = await api('/audit-logs?limit=200');
  el.innerHTML = `
    <div class="panel glass">
      <h2>审计日志（最近 ${logs.length} 条）</h2><div class="desc">append-only，按时间倒序</div>
      ${logs.length ? `
        <table><tr><th>时间</th><th>操作</th><th>对象</th><th>管理员</th><th>详情</th></tr>
        ${logs.map((l) => `
          <tr>
            <td style="white-space:nowrap">${dt(l.createdAt)}</td>
            <td><span class="pill green">${esc(l.action)}</span></td>
            <td class="mono">${esc(l.target)}</td>
            <td>${l.adminId === undefined || l.adminId === null ? '—' : l.adminId}</td>
            <td class="detail">${esc(JSON.stringify(l.detail))}</td>
          </tr>`).join('')}</table>` : '<div class="empty">暂无日志</div>'}
    </div>`;
}

/* ---------------- 启动：尝试会话恢复 ---------------- */
(async () => {
  try {
    const me = await api('/me');
    enter(me.username);
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
